<div class="layout">
  <header class="header">
    <a class="brand" routerLink="/">Wishlist</a>
    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Поиск
      </a>
      <a routerLink="/add-by-url" routerLinkActive="active">По ссылке</a>
      <a routerLink="/fusion" routerLinkActive="active">Гибриды</a>
      <a routerLink="/wishlist" routerLinkActive="active">
        Вишлист
        @if (wishlist.activeCount() > 0) {
          <span class="nav__badge">{{ wishlist.activeCount() }}</span>
        }
      </a>
    </nav>
  </header>

  <main class="main">
    <router-outlet />
  </main>

  <footer class="footer">
    BFF · поиск + импорт по URL · вишлист в localStorage
  </footer>
</div>
