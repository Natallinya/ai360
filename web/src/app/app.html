<div class="app-root_layout flex flex-column min-h-screen">
  <div class="app-root_header flex align-items-center gap-4">
    <a class="app-root_brand" routerLink="/">Wishlist</a>
    <div class="app-root_nav flex align-items-center gap-2 ml-auto">
      <a
        class="app-root_nav-link"
        routerLink="/"
        routerLinkActive="app-root_nav-link_active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Поиск
      </a>
      <a
        class="app-root_nav-link"
        routerLink="/add-by-url"
        routerLinkActive="app-root_nav-link_active"
      >
        По ссылке
      </a>
      <a
        class="app-root_nav-link"
        routerLink="/fusion"
        routerLinkActive="app-root_nav-link_active"
      >
        Гибриды
      </a>
      <a
        class="app-root_nav-link"
        routerLink="/wishlist"
        routerLinkActive="app-root_nav-link_active"
      >
        Вишлист
        @if (wishlist.activeCount() > 0) {
          <span class="app-root_badge">{{ wishlist.activeCount() }}</span>
        }
      </a>
    </div>
  </div>

  <div class="app-root_main flex-1">
    <router-outlet />
  </div>

  <div class="app-root_footer">
    Поиск · вишлист · подарки без лишней суеты
  </div>
</div>
