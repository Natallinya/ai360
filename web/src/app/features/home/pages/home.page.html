<div class="app-home-page flex flex-column gap-4">
  <p-card class="app-home-page_hero-block w-full" styleClass="app-home-page_hero-card">
    <p class="app-home-page_eyebrow">Wishlist Aggregator</p>
    <div class="app-home-page_title">Найдите желанное на разных площадках</div>
    <p class="app-home-page_lead">
      Один запрос — несколько магазинов — один уютный список желаний.
    </p>

    <div class="app-home-page_search-row flex align-items-stretch flex-wrap gap-2">
      <app-search-form class="app-home-page_search flex-1" (search)="onSearch($event)" />
    </div>

    <div class="app-home-page_chips flex flex-wrap gap-2">
      @for (query of sampleQueries; track query) {
        <p-tag
          class="app-home-page_chip"
          [value]="query"
          severity="secondary"
          (click)="onSearch(query)"
        />
      }
    </div>

    <p class="app-home-page_hint">
      Есть ссылка?
      @for (link of quickLinks; track link.route; let i = $index) {
        @if (i > 0) {
          ·
        }
        <a [routerLink]="link.route">{{ link.label }}</a>
      }
    </p>
  </p-card>
</div>
