<div class="app-fusion-form flex flex-column gap-3 w-full">
  <div class="app-fusion-form_row flex align-items-end flex-wrap gap-2">
    <div class="app-fusion-form_field flex flex-column gap-1">
      <p class="app-fusion-form_label">Первое</p>
      <input
        pInputText
        class="app-fusion-form_input"
        type="text"
        name="animal1"
        [(ngModel)]="animal1"
        placeholder="кот"
        required
        maxlength="40"
        [disabled]="loading()"
        (keydown.enter)="$event.preventDefault(); onSubmit()"
      />
    </div>

    <span class="app-fusion-form_plus">+</span>

    <div class="app-fusion-form_field flex flex-column gap-1">
      <p class="app-fusion-form_label">Второе</p>
      <input
        pInputText
        class="app-fusion-form_input"
        type="text"
        name="animal2"
        [(ngModel)]="animal2"
        placeholder="сова"
        required
        maxlength="40"
        [disabled]="loading()"
        (keydown.enter)="$event.preventDefault(); onSubmit()"
      />
    </div>

    <p-button
      type="button"
      [label]="loading() ? 'Генерация 15–60 с…' : 'Скрестить'"
      styleClass="app-fusion-form_submit"
      [disabled]="loading()"
      (onClick)="onSubmit()"
    />
  </div>

  <div class="app-fusion-form_styles flex flex-column gap-2">
    <p class="app-fusion-form_label">Стиль</p>
    <p-selectbutton
      class="app-fusion-form_style-toggle"
      name="fusionStyle"
      [options]="styles"
      [(ngModel)]="style"
      optionLabel="label"
      optionValue="id"
    />
  </div>
</div>
