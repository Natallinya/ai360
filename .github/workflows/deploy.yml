name: Deploy

on:
  push:
    branches: [main, development]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build API (smoke)
        run: npm run build -w api

      - name: Configure production API URL
        run: node scripts/write-web-env.mjs
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Build Web for GitHub Pages
        run: npm run build -w web -- --configuration=github-pages

      - name: Prepare GitHub Pages artifacts
        run: node scripts/prepare-github-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/web/browser

  deploy-web:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
